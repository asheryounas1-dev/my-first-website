
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            padding: 50px 30px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: white;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>
            Hello! This is my first website built
            using HTML and CSS. I am learning
            web development and building something amazing.
        </p>

        <a href="https://github.com/" target="_blank">
            Explore GitHub
        </a>

        <div class="footer">
            © 2026 My First Website. All Rights Reserved.
        </div>
    </div>

</body>
</html>
